<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#02040b"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="30"/>
  
  <!-- Outer Orbit Rings -->
  <circle cx="300" cy="300" r="240" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="300" cy="300" r="210" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="300" cy="300" r="180" fill="none" stroke="#00c6ff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="15 10"/>

  <!-- Core Outer Glow Circle -->
  <circle cx="300" cy="300" r="160" fill="#061838" stroke="url(#cyanBlue)" stroke-width="3" filter="url(#glow)"/>

  <!-- Developer Avatar Silhouette / Tech Graphic -->
  <!-- Head Circle -->
  <circle cx="300" cy="220" r="65" fill="#0f2b5c" stroke="url(#cyanBlue)" stroke-width="2"/>
  <!-- Body Shield -->
  <path d="M 200 420 C 200 320, 400 320, 400 420 L 380 450 C 320 470, 280 470, 220 450 Z" fill="#0a2046" stroke="url(#cyanBlue)" stroke-width="2"/>

  <!-- Monogram Initials IM -->
  <text x="300" y="235" font-family="'Inter', sans-serif" font-weight="900" font-size="42" fill="#00f2fe" text-anchor="middle" letter-spacing="2" filter="url(#glow)">IM</text>

  <!-- Code Overlay Elements -->
  <text x="140" y="160" font-family="monospace" font-size="16" fill="#00f2fe" opacity="0.6">&lt;Developer /&gt;</text>
  <text x="400" y="160" font-family="monospace" font-size="16" fill="#3b82f6" opacity="0.6">&lt;CyberSec /&gt;</text>
  <text x="120" y="440" font-family="monospace" font-size="16" fill="#3b82f6" opacity="0.6">const stack = ['Flutter', 'React'];</text>
  <text x="360" y="440" font-family="monospace" font-size="16" fill="#00f2fe" opacity="0.6">sec.audit(status: 'SECURE');</text>

  <!-- Glowing Nodes -->
  <circle cx="300" cy="60" r="6" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="540" cy="300" r="6" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="300" cy="540" r="6" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="60" cy="300" r="6" fill="#3b82f6" filter="url(#glow)"/>
</svg>
