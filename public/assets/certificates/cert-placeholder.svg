<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111c38"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#certBg)" rx="16"/>
  <rect x="25" y="25" width="750" height="500" fill="none" stroke="url(#goldBorder)" stroke-width="3" rx="12"/>
  <rect x="35" y="35" width="730" height="480" fill="none" stroke="#1e293b" stroke-width="1" rx="8"/>

  <!-- Watermark Shield Icon -->
  <circle cx="400" cy="275" r="120" fill="#1e293b" opacity="0.3"/>

  <!-- Certificate Content -->
  <text x="400" y="110" font-family="'Cinzel', serif, sans-serif" font-weight="bold" font-size="28" fill="#00f2fe" text-anchor="middle" letter-spacing="4">CERTIFICATE OF ACHIEVEMENT</text>
  <text x="400" y="145" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">PROUDLY PRESENTED TO</text>
  
  <text x="400" y="210" font-family="sans-serif" font-weight="900" font-size="34" fill="#f8fafc" text-anchor="middle">Ibrahim Mohamed</text>
  
  <line x1="250" y1="230" x2="550" y2="230" stroke="#00f2fe" stroke-width="2"/>

  <text x="400" y="280" font-family="sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">In recognition of successful completion of specialized technical training</text>
  <text x="400" y="310" font-family="sans-serif" font-weight="bold" font-size="20" fill="#38bdf8" text-anchor="middle">Cybersecurity &amp; Application Security</text>

  <!-- Seal -->
  <circle cx="400" cy="400" r="40" fill="#0369a1" stroke="#00f2fe" stroke-width="3"/>
  <text x="400" y="406" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">VERIFIED</text>
</svg>
